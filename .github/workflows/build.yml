name: Build assembly examples

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install --yes nasm
      - name: Assemble and link
        run: make
